name: Publish CV to latest release

on:
  push:
    branches: [master]
    paths:
      - 'examples/cv-eduardo-alvarado.pdf'
      - '.github/workflows/publish-cv.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CV PDF
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PDF_NAME: cv-eduardo-alvarado.pdf
          PDF_PATH_IN_REPO: examples/cv-eduardo-alvarado.pdf
        run: |
          set -e
          echo "Fetching $REPO @ $SHA :: $PDF_PATH_IN_REPO"
          gh api \
            -H "Accept: application/vnd.github.raw" \
            "/repos/$REPO/contents/$PDF_PATH_IN_REPO?ref=$SHA" \
            > "$PDF_NAME"
          ls -la "$PDF_NAME"
          file "$PDF_NAME"
          file "$PDF_NAME" | grep -q "PDF document" \
            || { echo "ERROR: not a PDF — first 200 bytes:"; head -c 200 "$PDF_NAME"; exit 1; }

      - name: Publish PDF to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          PDF_NAME: cv-eduardo-alvarado.pdf
        run: |
          set -e
          if gh release view latest >/dev/null 2>&1; then
            echo "Updating existing 'latest' release asset"
            gh release upload latest "$PDF_NAME" --clobber
          else
            echo "Creating new 'latest' release"
            gh release create latest "$PDF_NAME" \
              --title "Latest CV" \
              --notes "Always serves the latest CV. Auto-updated on every push to master that changes $PDF_NAME." \
              --latest
          fi